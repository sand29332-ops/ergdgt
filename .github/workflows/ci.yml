name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tier 1 — pure-Python tests (no C++ build needed).
  python-tests:
    name: python tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python_quant/requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Run Tier 1 tests
        run: python -m pytest python_quant/tests -v

  # Tier 2 — C++ engine + pybind module + parity/diff tests on real bytes.
  build-cpp:
    name: C++ build + ctest + pybind parity
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python_quant/requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DNEXUS_BUILD_PYBIND=ON \
            -DNEXUS_NATIVE_ARCH=OFF \
            -DNEXUS_ENABLE_CUDA=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE="$(command -v python)" \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
      - name: Build
        run: cmake --build build --config Release -j
      - name: CTest
        # windows-latest defaults to the multi-config Visual Studio generator, so
        # test configs live under build/Release/ and ctest needs -C. Ubuntu's
        # single-config generator ignores the flag.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ctest --test-dir build -C Release --output-on-failure
          else
            ctest --test-dir build --output-on-failure
          fi
      - name: Parity + diff tests (needs compiled module in bindings/)
        run: python -m pytest python_quant/tests bindings/tests -v

  # Lint — new code must be clean; sweep widens as the research layer lands.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff
      - name: ruff check
        run: ruff check python_quant/nexus_quant/ bindings/